<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Marioma Nails — Book Your Appointment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17140F;
    --paper:#FAF6F1;
    --paper-deep:#F1E7DA;
    --card:#FFFFFF;
    --gold:#B08D57;
    --gold-light:#D9C6A0;
    --gold-dark:#8A6D3F;
    --rose:#C99A8E;
    --champagne:#DCC9A3;
    --espresso:#6B5236;
    --line: rgba(23,20,15,0.1);
    --shadow: 0 10px 30px rgba(23,20,15,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--ink);}
  body{
    font-family:'Poppins',sans-serif;
    color:var(--ink);
    display:flex; justify-content:center;
    min-height:100vh;
  }
  #app{
    width:100%; max-width:480px; min-height:100vh;
    background:var(--paper);
    display:flex; flex-direction:column;
  }

  .hero{
    padding:34px 24px 26px;
    background: linear-gradient(180deg, var(--paper-deep), var(--paper) 85%);
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:11.5px; letter-spacing:3px; text-transform:uppercase;
    color:var(--gold-dark); font-weight:600; margin-bottom:10px;
  }
  .hero h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:34px; line-height:1.08;
    margin:0 0 10px; color:var(--ink);
  }
  .hero h1 em{ font-style:italic; color:var(--gold-dark); font-weight:500; }
  .hero p{ font-size:13.5px; color:var(--ink); opacity:.62; margin:0; line-height:1.6; max-width:34ch; }
  .window-pill{
    display:inline-flex; align-items:center; gap:6px; margin-top:16px;
    background:var(--card); border:1px solid var(--line); border-radius:30px;
    padding:8px 14px; font-size:12px; font-weight:500; color:var(--ink); opacity:.8;
  }

  main{ flex:1; padding:0 24px 40px; }
  section{ margin-top:28px; }
  .label{
    font-size:11px; letter-spacing:2px; text-transform:uppercase; font-weight:600;
    color:var(--gold-dark); margin-bottom:12px;
  }

  .swatches{ display:flex; gap:10px; }
  .swatch{
    flex:1; background:var(--card); border:1.5px solid var(--line); border-radius:16px;
    padding:14px 8px 12px; text-align:center; cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .swatch:active{ transform:scale(0.97); }
  .swatch.selected{ border-color:var(--gold); box-shadow:var(--shadow); }
  .swatch-dot{
    width:30px; height:30px; border-radius:50%; margin:0 auto 10px;
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.12), inset 0 2px 3px rgba(255,255,255,0.4);
  }
  .swatch-name{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .swatch-price{ font-size:11.5px; color:var(--ink); opacity:.55; margin-top:2px; }

  .date-strip{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;
  }
  .date-strip::-webkit-scrollbar{ display:none; }
  .date-chip{
    flex:0 0 auto; width:52px; padding:10px 0; text-align:center; border-radius:14px;
    background:var(--card); border:1.5px solid var(--line); cursor:pointer;
  }
  .date-chip .dow{ font-size:10px; text-transform:uppercase; letter-spacing:.5px; opacity:.55; }
  .date-chip .dnum{ font-size:16px; font-weight:600; margin-top:2px; }
  .date-chip.selected{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .date-chip.selected .dow{ opacity:.7; }
  .date-chip.closed{ opacity:.32; cursor:not-allowed; }

  .time-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .time-chip{
    padding:9px 14px; border-radius:20px; background:var(--card); border:1.5px solid var(--line);
    font-size:13px; font-weight:500; cursor:pointer;
  }
  .time-chip.selected{ background:var(--gold); border-color:var(--gold); color:#fff; }
  .time-empty{ font-size:13px; opacity:.55; padding:6px 2px; }

  .field{ margin-top:18px; }
  .field label{ display:block; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; color:var(--ink); opacity:.5; margin-bottom:8px; }
  .field input{
    width:100%; padding:11px 2px; border:none; border-bottom:1.5px solid var(--line);
    background:transparent; font-family:inherit; font-size:16px; color:var(--ink);
  }
  .field input:focus{ outline:none; border-bottom-color:var(--gold); }
  .field input::placeholder{ color:var(--ink); opacity:.3; }

  .btn{
    border:none; cursor:pointer; font-family:inherit; font-weight:600; border-radius:14px;
    padding:16px; font-size:15px; width:100%; letter-spacing:.3px;
  }
  .btn-gold{ background:linear-gradient(135deg, var(--gold-light), var(--gold)); color:#241C10; box-shadow:var(--shadow); margin-top:30px; }
  .btn-gold:active{ transform:scale(0.98); }
  .btn-gold:disabled{ opacity:.6; }
  .note{ font-size:12px; color:var(--ink); opacity:.5; line-height:1.7; margin-top:14px; text-align:center; }

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:30px;
    font-size:13.5px; box-shadow:var(--shadow); z-index:50; opacity:0; pointer-events:none;
    transition:opacity .25s; max-width:88%; text-align:center;
  }
  .toast.show{ opacity:1; }

  .success{ text-align:center; padding:70px 26px; }
  .success .icon{ font-size:44px; margin-bottom:16px; color:var(--gold-dark); }
  .success h2{ font-family:'Fraunces', serif; color:var(--ink); font-size:26px; margin:0 0 10px; font-weight:600; }
  .success p{ color:var(--ink); font-size:14px; line-height:1.8; opacity:.6; margin:0 0 28px; }
  .loading{ text-align:center; padding:80px 20px; color:var(--ink); opacity:.5; font-size:14px; }
</style>
</head>
<body>
<div id="app">
  <div class="hero">
    <div class="eyebrow">Marioma Nails</div>
    <h1>Reserve your <em>set</em></h1>
    <p>Hand-finished acrylic, dip, and gel — book a time that works for you.</p>
    <div id="window-pill"></div>
  </div>
  <main id="content">
    <div class="loading">Loading…</div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  emailjs.init({ publicKey: "xkpcGJOFhbNNN_XEV" });
</script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBA7SXcaGf8Ouvi49f_5LMZzYjKtdFUsuw",
    authDomain: "marioma-nails.firebaseapp.com",
    projectId: "marioma-nails",
    storageBucket: "marioma-nails.firebasestorage.app",
    messagingSenderId: "665411474628",
    appId: "1:665411474628:web:b127400683ab2a6c772591"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
</script>
<script>
const DEFAULT_SERVICES = [
  { id:'svc1', name:'Acrylic', price:35 },
  { id:'svc2', name:'Dip Powder', price:35 },
  { id:'svc3', name:'Hard Gel', price:35 },
];
const SWATCH_COLORS = ['var(--rose)', 'var(--champagne)', 'var(--espresso)'];

let services = [];
let bookingSettings = null;
let selectedServiceId = null;
let selectedDate = null;
let selectedTime = null;

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
function sendBookingEmail(name, phone, serviceName, date, time){
  emailjs.send('service_hs9q1d2', 'template_jcedvyg', {
    customer_name: name,
    service_name: serviceName,
    booking_date: fmtDateHuman(date),
    booking_time: time,
    customer_phone: phone
  }).catch(err=>{
    console.error('EmailJS send failed:', err);
  });
}
function buildSlots(startTime, endTime, minutes){
  const slots = [];
  const [sh, sm] = startTime.split(':').map(Number);
  const [eh, em] = endTime.split(':').map(Number);
  let cur = sh*60+sm;
  const end = eh*60+em;
  while(cur + minutes <= end){
    const h = String(Math.floor(cur/60)).padStart(2,'0');
    const m = String(cur%60).padStart(2,'0');
    slots.push(`${h}:${m}`);
    cur += minutes;
  }
  return slots;
}
function fmtDateHuman(dateStr){
  if(!dateStr) return '—';
  const [y,m,d] = dateStr.split('-').map(Number);
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${months[m-1]} ${d}`;
}
function addDays(dateStr, n){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+n);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function getDaySchedule(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dow = new Date(y, m-1, d).getDay(); // 0=Sunday ... 6=Saturday
  const sched = (bookingSettings.weeklySchedule || {})[String(dow)];
  if(!sched || sched.open === false) return null;
  return { start: sched.start || '10:00', end: sched.end || '17:00' };
}

function renderClosed(){
  const main = document.getElementById('content');
  main.innerHTML = `
    <div class="success">
      <div class="icon">✦</div>
      <h2>Booking Is Currently Closed</h2>
      <p>Please reach out directly to book your appointment.</p>
    </div>`;
}

function renderForm(){
  const main = document.getElementById('content');
  const effMin = bookingSettings.startDate < todayStr() ? todayStr() : bookingSettings.startDate;
  const effMax = bookingSettings.endDate;
  selectedServiceId = services[0] ? services[0].id : null;
  selectedDate = effMin;
  let guardD = 0;
  while(!getDaySchedule(selectedDate) && selectedDate <= effMax && guardD < 90){
    selectedDate = addDays(selectedDate, 1);
    guardD++;
  }
  selectedTime = null;

  document.getElementById('window-pill').innerHTML =
    `<div class="window-pill">📅&nbsp; ${fmtDateHuman(effMin)} – ${fmtDateHuman(effMax)}</div>`;

  main.innerHTML = `
    <section>
      <div class="label">Choose your service</div>
      <div class="swatches" id="swatches"></div>
    </section>
    <section>
      <div class="label">Pick a date</div>
      <div class="date-strip" id="date-strip"></div>
    </section>
    <section>
      <div class="label">Pick a time</div>
      <div class="time-grid" id="time-grid"><div class="time-empty">Loading available times…</div></div>
    </section>
    <section>
      <div class="field">
        <label>Your Name</label>
        <input id="b-name" placeholder="Full name">
      </div>
      <div class="field">
        <label>Phone Number</label>
        <input id="b-phone" placeholder="(555) 123-4567" type="tel">
      </div>
    </section>
    <button class="btn btn-gold" id="b-submit">Confirm Booking</button>
    <div class="note">Your request will be reviewed, and you'll be contacted if anything needs to change.</div>
  `;

  renderSwatches();
  renderDateStrip(effMin, effMax);
  document.getElementById('b-submit').onclick = submitBooking;
  loadAvailableSlots();
}

function renderSwatches(){
  const el = document.getElementById('swatches');
  el.innerHTML = services.map((s,i)=>`
    <div class="swatch ${s.id===selectedServiceId?'selected':''}" data-id="${s.id}">
      <div class="swatch-dot" style="background:${SWATCH_COLORS[i % SWATCH_COLORS.length]};"></div>
      <div class="swatch-name">${escapeHtml(s.name)}</div>
      <div class="swatch-price">$${s.price}</div>
    </div>
  `).join('');
  el.querySelectorAll('.swatch').forEach(card=>{
    card.onclick = ()=>{
      selectedServiceId = card.dataset.id;
      el.querySelectorAll('.swatch').forEach(c=>c.classList.toggle('selected', c===card));
    };
  });
}

function renderDateStrip(effMin, effMax){
  const el = document.getElementById('date-strip');
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = '';
  let cur = effMin;
  let guard = 0;
  while(cur <= effMax && guard < 90){
    const [y,m,d] = cur.split('-').map(Number);
    const dow = dows[new Date(y, m-1, d).getDay()];
    const closed = !getDaySchedule(cur);
    html += `<div class="date-chip ${cur===selectedDate?'selected':''} ${closed?'closed':''}" data-date="${cur}" ${closed?'data-closed="1"':''}>
      <div class="dow">${dow}</div><div class="dnum">${d}</div>
    </div>`;
    cur = addDays(cur, 1);
    guard++;
  }
  el.innerHTML = html;
  el.querySelectorAll('.date-chip').forEach(chip=>{
    if(chip.dataset.closed) return;
    chip.onclick = ()=>{
      selectedDate = chip.dataset.date;
      el.querySelectorAll('.date-chip').forEach(c=>c.classList.toggle('selected', c===chip));
      loadAvailableSlots();
    };
  });
}

async function loadAvailableSlots(){
  const grid = document.getElementById('time-grid');
  grid.innerHTML = `<div class="time-empty">Loading available times…</div>`;
  selectedTime = null;
  if(!selectedDate) return;
  const daySched = getDaySchedule(selectedDate);
  if(!daySched){
    grid.innerHTML = `<div class="time-empty">Closed on this day</div>`;
    return;
  }
  const allSlots = buildSlots(daySched.start, daySched.end, bookingSettings.slotMinutes || 60);
  try{
    const snap = await db.collection('appointments').where('date','==',selectedDate).get();
    const taken = new Set(snap.docs.filter(d=>d.data().status!=='cancelled').map(d=>d.data().time));
    const free = allSlots.filter(t=>!taken.has(t));
    if(!free.length){
      grid.innerHTML = `<div class="time-empty">No available times on this day</div>`;
      return;
    }
    grid.innerHTML = free.map(t=>`<div class="time-chip" data-time="${t}">${t}</div>`).join('');
    grid.querySelectorAll('.time-chip').forEach(chip=>{
      chip.onclick = ()=>{
        selectedTime = chip.dataset.time;
        grid.querySelectorAll('.time-chip').forEach(c=>c.classList.toggle('selected', c===chip));
      };
    });
  }catch(e){
    grid.innerHTML = `<div class="time-empty">Could not load available times</div>`;
  }
}

async function submitBooking(){
  const name = document.getElementById('b-name').value.trim();
  const phone = document.getElementById('b-phone').value.trim();
  const svc = services.find(s=>s.id===selectedServiceId);

  if(!name){ showToast('Please enter your name'); return; }
  if(!phone){ showToast('Please enter your phone number'); return; }
  if(!selectedServiceId){ showToast('Please choose a service'); return; }
  if(!selectedDate){ showToast('Please choose a date'); return; }
  if(!selectedTime){ showToast('Please choose an available time'); return; }

  const effMin = bookingSettings.startDate < todayStr() ? todayStr() : bookingSettings.startDate;
  if(selectedDate < effMin || selectedDate > bookingSettings.endDate){
    showToast('This date is outside the available booking window, please pick another date');
    return;
  }
  const daySched = getDaySchedule(selectedDate);
  if(!daySched){
    showToast('We are closed on this day, please pick another date');
    return;
  }
  const allowedSlots = buildSlots(daySched.start, daySched.end, bookingSettings.slotMinutes || 60);
  if(!allowedSlots.includes(selectedTime)){
    showToast('That time is not available, please choose one from the list');
    return;
  }

  const btn = document.getElementById('b-submit');
  btn.disabled = true; btn.textContent = 'Booking…';

  const slotId = `${selectedDate}_${selectedTime.replace(':','')}`;
  const slotRef = db.collection('appointments').doc(slotId);

  try{
    await db.runTransaction(async (tx)=>{
      const doc = await tx.get(slotRef);
      if(doc.exists && doc.data().status !== 'cancelled'){
        throw new Error('TAKEN');
      }
      tx.set(slotRef, {
        name, phone, serviceId: selectedServiceId,
        serviceName: svc ? svc.name : '—',
        date: selectedDate, time: selectedTime,
        status: 'pending',
        price: svc ? svc.price : 0,
        source: 'online',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    sendBookingEmail(name, phone, svc ? svc.name : '—', selectedDate, selectedTime);
    renderSuccess(name);
  }catch(e){
    if(e && e.message === 'TAKEN'){
      showToast('Sorry, someone just booked that slot — please pick another time');
      loadAvailableSlots();
    }else{
      showToast('Something went wrong, please try again');
    }
    btn.disabled = false; btn.textContent = 'Confirm Booking';
  }
}

function renderSuccess(name){
  const main = document.getElementById('content');
  main.innerHTML = `
    <div class="success">
      <div class="icon">✦</div>
      <h2>Thank you, ${escapeHtml(name)}</h2>
      <p>Your request has been received and will be reviewed. You'll be contacted if anything needs to change. Thank you for choosing Marioma Nails.</p>
      <button class="btn btn-gold" onclick="location.reload()">Book Another Appointment</button>
    </div>
  `;
}

(function init(){
  Promise.all([
    db.collection('services').get(),
    db.collection('settings').doc('booking').get()
  ]).then(([svcSnap, settingsDoc])=>{
    services = svcSnap.empty ? DEFAULT_SERVICES.slice() : svcSnap.docs.map(d=>({ id:d.id, ...d.data() }));
    if(!settingsDoc.exists){ renderClosed(); return; }
    bookingSettings = settingsDoc.data();
    const today = todayStr();
    if(!bookingSettings.endDate || bookingSettings.endDate < today){ renderClosed(); return; }
    renderForm();
  }).catch(()=>{
    services = DEFAULT_SERVICES.slice();
    renderClosed();
  });
})();
</script>
</body>
</html>
